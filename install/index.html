  <main>
    <h1>怎么打开未签名包</h1>
    <p>0.7.2 内测没有 Apple 公证，也没有 Windows Authenticode。系统拦截是预期的。</p>
    <h2>macOS</h2>
    <ol>
      <li>下载后不要双击。按住 Control 再点 Moss，或右键「打开」。</li>
      <li>若已拦过：系统设置 → 隐私与安全性 → 「仍要打开」。</li>
    </ol>
    <h2>Windows</h2>
    <ol>
      <li>SmartScreen 出现时点「更多信息」，再点「仍要运行」。</li>
    </ol>
    <p class="fine"><a href="../">返回下载</a></p>
  </main>
